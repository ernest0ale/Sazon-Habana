<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Iniciar Sesión - Sazón Habana</title>
  <link rel="shortcut icon" href="resources/sazonHabana_lightLogo.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="frontend/css/styles.css">
  <script src="frontend/scripts/tailwind.config.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- TOAST NOTIFICATION -->
  <div id="toast-notification" class="fixed top-24 right-6 z-50 transform translate-x-96 opacity-0 transition-all duration-300 flex items-center gap-3 bg-brand-card border border-brand-border px-5 py-4 rounded-2xl shadow-xl max-w-sm">
    <div id="toast-icon-wrapper" class="w-10 h-10 rounded-full flex items-center justify-center text-white"></div>
    <div><h4 id="toast-title" class="font-bold text-sm"></h4><p id="toast-desc" class="text-xs opacity-80"></p></div>
  </div>

  <!-- SEARCH OVERLAY -->
  <div id="search-overlay" class="search-overlay" style="display:none;">
    <div class="search-overlay-container">
      <div class="search-input-wrapper">
        <input type="text" id="search-overlay-input" placeholder="Buscar restaurantes, platos o zonas..." onkeypress="if(event.key==='Enter'){executeSearch();}" oninput="handleSearchSuggestions()">
        <button class="search-submit-btn" onclick="executeSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="search-overlay-close" onclick="closeSearchOverlay()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="search-suggestions" class="search-results-suggestions"></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 border-b border-brand-border shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

      <div class="flex items-center gap-3 md:w-auto w-full justify-center md:justify-start">
        <button onclick="toggleMobileMenu()" id="mobile-menu-btn-header" class="md:hidden text-brand-text hover:text-brand-primary focus:outline-none p-2 absolute left-4">
          <i class="fa-solid fa-bars text-2xl"></i>
        </button>

        <a href="index.html" class="flex items-center gap-3 group mobile-header-logo md:mx-0 mx-auto">
          <img id="headerLogo" src="resources/sazonHabana_lightLogo.png" alt="Sazón Habana" class="h-12 w-auto transition-all duration-300">
          <div class="flex flex-col">
            <span class="text-xl md:text-2xl font-serif font-bold text-brand-text tracking-wide transition-colors group-hover:text-brand-primary leading-none">Sazón Habana</span>
            <span class="text-[10px] uppercase tracking-widest text-brand-secondary font-bold mt-0.5 hidden md:block">Sabor auténtico y cubanía</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex space-x-8">
        <a href="index.html" id="nav-home" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-house"></i> Inicio</a>
        <a href="espacios.html" id="nav-listado" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-utensils"></i> Espacios</a>
        <a href="mapa.html" id="nav-mapa" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent flex items-center gap-2"><i class="fa-solid fa-map"></i> Mapa</a>
        <a id="nav-solicitar" href="solicitarEspacio.html" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent hidden flex items-center gap-2"><i class="fa-solid fa-store"></i> Solicitar espacio</a>
        <a id="nav-mi-espacio" href="miEspacio.html" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent hidden flex items-center gap-2"><i class="fa-solid fa-pen-to-square"></i> Mi espacio</a>
        <a href="admin.html" id="nav-admin" class="nav-btn text-brand-text hover:text-brand-primary font-bold text-base pb-1 border-b-2 border-transparent hidden flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Admin Panel</a>
      </nav>

      <div class="flex items-center gap-4">
        <button onclick="openSearchOverlay()" class="text-brand-text hover:text-brand-primary p-2 text-xl"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button onclick="toggleDarkMode()" class="text-brand-text hover:text-brand-primary p-2 text-xl"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
        <div id="auth-buttons-container" class="flex items-center"></div>
      </div>
    </div>

    <div id="mobile-menu" class="hidden md:hidden bg-brand-bg border-b border-brand-border py-4 px-6 space-y-3 shadow-inner">
      <a href="index.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2"><i class="fa-solid fa-house mr-3 mobile-nav-icon"></i> Inicio</a>
      <a href="espacios.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2"><i class="fa-solid fa-utensils mr-3 mobile-nav-icon"></i> Espacios</a>
      <a href="mapa.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2"><i class="fa-solid fa-map mr-3 mobile-nav-icon"></i> Mapa</a>
      <a id="mobile-nav-solicitar" href="solicitarEspacio.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2 hidden"><i class="fa-solid fa-store mr-3 mobile-nav-icon"></i> Solicitar espacio</a>
      <a id="mobile-nav-mi-espacio" href="miEspacio.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2 hidden"><i class="fa-solid fa-pen-to-square mr-3 mobile-nav-icon"></i> Mi espacio</a>
      <a id="mobile-nav-admin" href="admin.html" class="block w-full text-left font-serif text-lg text-brand-text hover:text-brand-primary py-2 hidden"><i class="fa-solid fa-shield-halved mr-3 mobile-nav-icon"></i> Admin Panel</a>
      <div id="auth-buttons-container-mobile" class="pt-2 space-y-2"></div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center py-16">
    <div class="max-w-md w-full px-4">
      <div class="bg-brand-card rounded-3xl p-8 border border-brand-border shadow-xl space-y-6">
        <div class="text-center">
          <h1 class="text-3xl font-serif font-bold text-brand-text">Iniciar Sesión</h1>
          <p class="text-xs text-brand-text/60">Bienvenido de vuelta a Sazón Habana.</p>
        </div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="text-xs font-bold uppercase text-brand-text/60">Correo o Teléfono</label>
            <input type="text" id="login-id" required placeholder="correo@ejemplo.com o 5XXXXXXX" class="w-full bg-brand-bg text-brand-text p-3.5 rounded-xl border border-brand-border outline-none">
          </div>
          <div>
            <div class="flex justify-between">
              <label class="text-xs font-bold uppercase text-brand-text/60">Contraseña</label>
              <button type="button" onclick="simulateRecovery()" class="text-[10px] text-brand-primary hover:underline">¿Olvidó su contraseña?</button>
            </div>
            <div class="password-wrapper">
              <input type="password" id="login-password" required class="w-full bg-brand-bg text-brand-text p-3.5 rounded-xl border border-brand-border outline-none">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password', this)">
                <i class="fa-regular fa-eye-slash"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="w-full py-3.5 bg-transparent border-2 border-brand-primary text-brand-primary hover:bg-brand-primary hover:text-white rounded-xl font-bold text-sm transition-all">
            Iniciar Sesión
          </button>
        </form>
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-brand-border/40"></div>
          <span class="flex-shrink mx-4 text-xs text-brand-text/50">¿No tienes cuenta?</span>
          <div class="flex-grow border-t border-brand-border/40"></div>
        </div>
        <a href="registro.html" class="btn-registro">
          Registrarse
        </a>
      </div>
    </div>
  </main>

  <!-- BACKEND -->
  <script src="backend/data.js"></script>
  <script src="backend/auth.js"></script>
  <script src="backend/resenas.js"></script>
  <script src="backend/solicitudes.js"></script>

  <!-- SCRIPTS FRONTEND -->
  <script src="frontend/scripts/main.js"></script>
  <script src="frontend/scripts/auth.js"></script>

  <script>
    window.onload = function() {
      initDatabase();
      loadSavedTheme();
      renderAuthNavs();
      updateHeaderLogo();
      
      if (getUsuarioActual()) {
        window.location.href = 'index.html';
      }
    };

    function updateHeaderLogo() {
      const isDark = document.documentElement.classList.contains('dark');
      const logo = document.getElementById('headerLogo');
      if (logo) {
        logo.src = isDark ? 'resources/sazonHabana_darkLogo.png' : 'resources/sazonHabana_lightLogo.png';
      }
    }

    const originalToggleDarkMode = toggleDarkMode;
    toggleDarkMode = function() {
      originalToggleDarkMode();
      updateHeaderLogo();
    };
  </script>
</body>
</html>
